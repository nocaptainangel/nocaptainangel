<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 14" width="1280" height="14">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2B8A62"/>
      <stop offset=".3" stop-color="#A2D57A"/>
      <stop offset=".5" stop-color="#F3E3B8"/>
      <stop offset=".7" stop-color="#D9A441"/>
      <stop offset=".85" stop-color="#D9804F"/>
      <stop offset="1" stop-color="#B06A8F"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="1280" height="14" rx="7"/></clipPath>
